stages:
  - check
  - build
  - deploy
  - mirror

checks:
  stage: check
  script:
    - uv run poe checks
    # Reason: assembly.step + .glb are committed; CI doesn't rebuild them
    # because plate_loader.fetch needs the CG plate STEP from sibling
    # edp-interface-plates repo. Cross-repo artifact pull lands later.
    - uv run pytest --junitxml=junit.xml --deselect src/assemblies/test_compute_container.py --deselect src/assemblies/test_grid_container.py --cov src/
    - uv run coverage xml
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    when: always
    reports:
      junit: junit.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

build:
  stage: build
  script:
    - uv run poe build-envelopes
    - uv run poe build-manifest
  artifacts:
    paths:
      - manifest.yaml
      - equipment/*/envelope.step
    expire_in: 1 day

deploy:
  stage: deploy
  needs: [build]
  only:
    - main
  variables:
    AWS_DEFAULT_REGION: us-east-1
    ARCNODE_ARTIFACTS_BUCKET: arcnode-artifacts
  script:
    # Reason: deploy pushes manifest + per-equipment specs/envelopes +
    # per-assembly bom/step/glb + plate artifacts (from sibling repo
    # path; sibling absent in CI so plate uploads will skip with warning
    # until cross-repo CI lands).
    - uv run poe push-s3

mirror:
  stage: mirror
  variables:
    GIT_STRATEGY: clone
    GIT_DEPTH: 0
  script:
    - git checkout -B main
    - git push --mirror git@github.com:arcnode-io/edp-module-assemblies.git
  only:
    - main
