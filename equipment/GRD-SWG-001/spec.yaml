notes: |
  ABB SafeGear 15kV is the v1 reference switchgear for the ARCNODE Grid
  Module. Specified at 1200A continuous / 50 kA AIC as a typical mid-band
  configuration. Actual deployment configurations vary in:

  - Voltage class (4.76 / 8.25 / 15 kV — pick the lowest that meets utility
    interconnect requirement; 15 kV covers most cases)
  - Continuous current (1200A / 2000A / 3000A — 1200A is sufficient for
    most ARCNODE deployments at 1 MVA scale)
  - Number of sections (single main, or main + tie + N feeders for larger
    deployments)
  - NEMA rating (NEMA 1 indoor standard; NEMA 3R outdoor walk-in for sites
    without indoor switchgear room)

  Sizing engine selects configuration per deployment based on customer
  utility interconnect specifications and ARCNODE deployment scale.

  Arc-resistant rating (per IEEE C37.20.7) is a meaningful safety feature
  for the off-grid resilience use case — internal arc faults vent
  controlled to top of unit, protecting personnel and adjacent equipment.
  Standard SafeGear feature, not an option.

  Protective relay selection: SafeGear ships with a vendor-agnostic
  protective relay socket. Common choices: SEL-351 (most common in US
  utility deployments), GE Multilin F35 (common in industrial), ABB REF
  series (when ABB-aligned). Relay choice drives the EMS comms protocol
  surface — most modern relays speak Modbus TCP and DNP3; some also
  IEC 61850. Capture relay selection as a deployment decision in BOM
  generator dependency rules.

  ITAR-domestic: ABB has US fabrication for ANSI-rated SafeGear
  (Pinetops NC and other US plants). Verify per-unit fab origin at
  procurement for DOD-eligible deployments. fab_tier set to dod_eligible
  with no restricted_entities flag, but per-unit verification is
  required for sovereign work.

  Alternates: Eaton Magnum, Siemens 8DJ, GE-Hitachi MV-class are
  functionally equivalent at 15 kV class. Add as v2 alternates if a
  deployment forces them; not seeded in v1.
