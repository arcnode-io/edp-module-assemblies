notes: |
  Tesla Megapack 2 XL is the AC-coupled BESS profile primary entry per
  ADR-001 (Bring Your Own BESS). Customer-supplied equipment; ARCNODE does
  not procure, ship, or install. ARCNODE's Grid Container interfaces with the
  Megapack over a single AC connection (480V 3-phase) and a single Ethernet
  comms link.

  Configuration options at deployment:
  - 2-Hour C010/C011: 1927 kW / 3854 kWh per Megapack
  - 4-Hour C010/C011: 979 kW / 3916 kWh per Megapack
  - 4-Hour C012: 1075 kW / 4300 kWh per Megapack
  - Non-standard 8-Hour available via Tesla configuration
  Sizing engine selects configuration based on customer autonomy requirement.

  Grid-forming capability confirmed via two sources: (1) the datasheet
  Archetypes list explicitly includes "C&I Off-Grid Microgrid", which
  requires grid-forming inverter behavior; (2) Tesla Energy Q1 2026
  reporting confirms grid-forming inverters with black-start capability
  in the current generation. Resolves Open Item 1 from ADR-001.

  Cell sourcing: Tesla uses CATL (China) and LG Energy Solution (Korea/US)
  cells across the Megapack production fleet. Cell origin varies per unit
  and per production run. For DOD-eligible deployments, cell-source
  certification must be obtained from Tesla at procurement; default
  classification is federal_civilian with DOD_1260H flag as conservative
  default.

  Protocol stack: Modbus TCP and DNP3 are standard. REST API was offered
  in earlier Megapack revisions but is not listed in the November 2025
  REV 2.0 datasheet — Tesla appears to have simplified the supported
  protocol stack. EMS integration uses Modbus TCP per ARCNODE convention.

  Safety: deflagration vents on the roof are the gating clearance
  consideration. Service envelope captures 3000 mm top clearance for
  vent operation; install_clearance separately captures crane lift
  clearance for the 38 t unit. Both required.

  Warranty: 15 years standard, extendable to 20 with Capacity Maintenance
  Agreement (CMA). Tesla requires a maintenance service agreement; capture
  in BOM generator dependency rules as a recurring-cost line item.

  Megablock (announced for late 2026): Tesla's planned Megablock product
  is 4× Megapack v3 + transformer + switchgear. Overlaps with ARCNODE's
  Grid Container function in the AC-coupled profile. Re-evaluate ARCNODE
  positioning when Megablock specs are published. Tracked as Open Item 4
  in ADR-001.
