      note: Rating, AC/DC ranges, protocol, size, weight and ambient are from a third-party CAB1000 sheet (Freedom Won, 23-Sep-25); EPC publishes its spec sheet only through sales (asked 2026-10-15). DC window at 480 VAC is 720-1500 V (761-1500 V at full power).
