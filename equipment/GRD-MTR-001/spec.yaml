notes: |
  Schneider PowerLogic ION9000 is the v1 reference revenue meter for the
  ARCNODE Grid Container. Sits at the utility point of interconnect,
  measures bidirectional power flow for utility billing and ARCNODE EMS
  telemetry.

  Class 0.1S accuracy (third-party certified ANSI C12.20 / IEC 62053-22) —
  the highest commercial accuracy class. Required for revenue-grade
  metering in most utility tariffs, especially where ARCNODE deployment
  participates in energy arbitrage or grid services.

  Power quality functions (in addition to revenue):
  - PQI-A certification per IEC 62586-1/-2
  - Sag/swell/interrupt detection
  - Disturbance Direction Detection (patented Schneider feature) —
    distinguishes utility-side vs customer-side power quality events
  - Harmonics analysis up to 63rd (511th via EcoStruxure software)
  - EN 50160 and IEEE 519 compliance reporting

  Communications stack:
  - Modbus TCP + RTU (primary EMS protocol)
  - DNP3 (utility SCADA)
  - IEC 61850 MMS (modern utility integration)
  - DLMS (international metering standard)
  - SNMP (IT-side monitoring)
  - Built-in HTTPS web server for local access

  Time synchronization: PTP (IEEE 1588), NTP, IRIG-B, GPS ASCII via
  RS-485. Sub-millisecond timestamping for sequence-of-events with the
  SEL-351-7 relay.

  EMS integration: Modbus TCP register map is the primary path. ION9000
  exposes ~3000 measurement points; EMS pulls the standard subset (kW,
  kVAR, kVA, PF, voltage per phase, current per phase, energy in/out,
  THD per phase, frequency).

  Modular I/O: 8 digital inputs, 4 digital outputs, 2 relay outputs
  standard. Up to 4 option modules add: 2 relays + 6 digital inputs OR
  2 analog outputs + 4 analog inputs. ARCNODE deployment uses standard
  I/O for breaker status indication and trip permissive signaling to
  the SEL-351-7 protective relay.

  Cybersecurity: HTTPS, SFTP, SNMPv3, syslog, 50 user accounts with role-
  based access, secure firmware updates. NERC CIP-eligible. Schneider
  publishes hardening guide for utility deployments.

  Sealed for revenue: ION9000 supports utility seals on the meter and
  cover, locking out configuration changes per utility tariff requirements.
  ARCNODE deployment includes utility witness commissioning step in the
  installation sequence document.

  ITAR-domestic: Schneider has US fab for PowerLogic line in Costa Rica
  and Mexico (NAFTA), plus EU. For DOD-eligible deployments, verify
  per-unit fab origin at procurement. fab_tier set to dod_eligible
  pending verification path.

  Alternates: GE EPM 9450/9650 (similar Class 0.1S meter), SATEC PM175
  (utility-grade alternative). Schneider ION9000 is v1 default given
  Schneider alignment with GRD-XFM-001 (Trihal transformer).
