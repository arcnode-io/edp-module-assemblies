notes: |
  Schneider Trihal is the v1 reference transformer for the ARCNODE Grid
  Module. Specified at 1000 kVA, 13.8 kV / 480 V, dyn11 vector group,
  IP31 indoor enclosure, copper windings, AN (natural air) cooling.

  Vector group dyn11: delta primary (HV), wye secondary (LV) with neutral
  brought out, 30° phase shift. Secondary 415Y/240V — phase-to-phase 415V
  for 3-phase rack PDUs, phase-to-neutral 240V matches HGX B200 PSU input
  range (200–240V). The wye-with-neutral secondary supports single-phase
  loads directly. 415V LV is non-standard in US (480V is convention) but
  is the AI datacenter trend for higher-density rack PDU economics.

  Bidirectional operation: transformer is inherently bidirectional. Used
  as step-up when ARCNODE exports to grid (BESS dispatch, PCS dispatch in
  DC-coupled profile), step-down when ARCNODE imports from grid (initial
  charging, grid-tied operation). The "step-up" framing is conventional
  — physically the transformer is symmetric.

  Cooling: AN (natural air) is standard. AF (forced air with fans) is an
  option that extends capacity by 40% and enables shorter ride-through of
  transient overloads. For ARCNODE deployments expecting frequent
  charge/discharge cycling at near-rated power, AF option is recommended.
  Capture as a deployment-specific upgrade in BOM generator rules.

  Cast-resin dry-type advantages over oil-filled:
  - No oil containment / spill-control civil works required
  - No fire-suppression requirements per most building codes
  - 20-year service life without oil testing or refurbishment
  - Indoor installation acceptable without specialty fire-rated room
  Net: lower lifecycle cost and simpler site civils. Pays back the
  modest premium over oil-filled within first deployment year for
  most ARCNODE site profiles.

  EcoDesign Tier 2 compliance (EU 548/2014, post-2021): Trihal complies
  by default. Required for European deployments; nice-to-have elsewhere.

  ITAR-domestic: Schneider has US manufacturing for Trihal in some
  capacity but the SKU referenced (TRI100013684152509) is IEC-rated,
  suggesting EU origin as primary. For DOD-eligible deployments,
  alternate ANSI-rated Trihal SKUs from Schneider's US fabrication
  facilities are required. fab_tier set conservatively at dod_eligible
  pending per-unit fab verification.

  Alternates: Eaton dry-type, GE-Prolec, Siemens GEAFOL are functionally
  equivalent. Add as v2 alternates if deployment forces them.

  Sizing notes: 1 MVA covers ARCNODE deployments up to ~800 kW continuous
  AC bus load (80% loading is conservative for transformer life). At v1
  HGX scale (~80 kW Compute load) this provides ~12x headroom — sized
  for future multi-Compute-Container deployments fed from one Grid
  Container, not just the single-container v1 case. Larger deployments
  use multiple ARCNODE Grid Containers in parallel.
