notes: |
  Management switch per ADR-019: NVIDIA's own OOB management switch for
  HGX/DGX racks. Takes the 7 node BMCs, 6 PDUs, the CDU and the SN5600's
  management port (15 of 48 RJ45); uplinks over fiber (QSFP28, breakout to
  1/10 GbE) through CG to the grid container switch. Fiber between
  containers avoids ground-potential differences between separate
  structures. Sits in the rack's free U above the PDUs.

  Sources: datasheet (datasheet_url) for ports, power, size, weight, SKUs;
  NVIDIA user manual https://networking-docs.nvidia.com/sn2201hw/specifications
  for the 0-40 °C operating range and 5000 m altitude.
