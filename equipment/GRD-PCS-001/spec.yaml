notes: |
  ARCNODE's PCS for dc_ext (ADR-022): one per grid container, on the
  customer's battery pad. CATL EnerOne+ strings (1164-1498 V DC) land on
  its DC input; its 480 V AC goes to the customer's 480 V : 13.8 kV
  step-up and MV disconnect, like a Megapack (ADR-016). The CATL maximum
  sits 2 V under the 1500 V DC limit; confirm cold open-circuit voltage
  with CATL.

  Black start needs external control power: specify an independent
  control-power source (small UPS or 24 VDC battery) with the pad.
