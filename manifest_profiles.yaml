# Curated profile→asset mapping consumed by build_manifest.py.
# Per ADR-006: this file (in this repo) is the source of truth for which
# variants/plates each deployment profile requires.
#
# Profiles in this file may reference assemblies/plates that don't exist
# yet; build_manifest.py validates and emits warnings for missing refs.
# Plate fleet: CG, CD. Every battery ties in at 13.8 kV outside the grid
# container (ADR-016, ADR-022), so no battery power comes in through a plate.
# Every site has a BESS, so every profile has a grid container.
# compute_container_by_gpu: the order's GPU type picks the compute variant.
#
# Defense is AC only: both DC couplings need CATL EnerOne+, which is on
# DOD 1260H. edp-api rejects federal + either DC coupling at ingress.

profiles:
  commercial_ac:
    # AC-coupled BESS (Tesla Megapack), tied in at 13.8 kV (ADR-016).
    compute_container: commercial-ac
    compute_container_by_gpu: { b200: commercial-ac, h100_sxm: commercial-ac-h100 }
    grid_container: commercial-ac
    grid_feeder_container: feeder
    interface_plates: [CG, CD]

  commercial_dc_int:
    # DC strings, but PCS lives in BESS pad, so it outputs AC and ties in
    # at 13.8 kV like commercial_ac (ADR-016). Same containers and plates.
    compute_container: commercial-ac
    compute_container_by_gpu: { b200: commercial-ac, h100_sxm: commercial-ac-h100 }
    grid_container: commercial-ac
    grid_feeder_container: feeder
    interface_plates: [CG, CD]

  commercial_dc_ext:
    # CATL DC strings → ARCNODE's PCS on the battery pad → 13.8 kV through
    # the customer's step-up, like commercial_ac (ADR-022). The PCS is a
    # site line, so the containers and plates are commercial_ac's.
    compute_container: commercial-ac
    compute_container_by_gpu: { b200: commercial-ac, h100_sxm: commercial-ac-h100 }
    grid_container: commercial-ac
    grid_feeder_container: feeder
    interface_plates: [CG, CD]

  defense_ac:
    # AC-coupled BESS, defense forward deployment. Same hardware as
    # commercial_ac but plates are 5083-H116 marine grade, 10 mm thick.
    compute_container: defense-ac
    compute_container_by_gpu: { b200: defense-ac, h100_sxm: defense-ac-h100 }
    grid_container: defense-ac
    grid_feeder_container: defense-feeder
    interface_plates: [CG, CD]
