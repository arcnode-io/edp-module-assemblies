notes: |
  CATL EnerOne+ is the DC-coupled BESS profile primary entry per ADR-001
  (Bring Your Own BESS). Customer-supplied equipment; ARCNODE does not
  procure, ship, or install. ARCNODE's Grid Container PCS (EPC PD500 at v1)
  interfaces with EnerOne over a DC bus and a CAN comms bus.

  PCS compatibility: EnerOne's voltage range (1164-1497V nominal, 600-1500V
  system compatibility per CATL marketing) overlaps with EPC PD500's DC
  input range (310-1250V). Operating window: 715-1250V where both are at
  rated performance (PD500 minimum at 480 VAC, EnerOne lower bound). Above
  1250V the PD500 cannot accept the DC input — sizing engine must constrain
  EnerOne operation or pair with a higher-voltage PCS. Document operating
  envelope in deployment-specific configurations.

  BMS architecture: CATL three-level distributed BMS — CSC (Cell Sensor
  Controller) → SBMU (String BMS Unit) → MBMU (Master BMS Unit). MBMU
  exposes Modbus TCP to the PCS and EMS over RJ45 (port 502, unit_id
  0x64, FC 0x03 read / 0x06 write-1 / 0x10 write-N, big-endian, 20 ms
  minimum poll period). The legacy A-CAN bus is still present on newer
  EnerX-class racks for backwards compatibility, but Modbus TCP is the
  primary EMS integration path. Register map: see
  `register_map.pdf` colocated in this directory (CATL ZNH Modbus TCP
  Protocol V1.3, 2022).

  Thermal: EnerOne+ has an integrated thermal management system (chiller,
  PTC heater, liquid cooling pipes). This system is internal to the rack
  and does not connect to the ARCNODE Compute Container (integrated thermal) CDU. Some auxiliary
  electrical load (the chiller compressor) appears as a load on the AC bus.
  Capture in sizing engine as part of the BESS pad-side electrical budget.

  Sourcing path: EnerOne is not sold directly to end customers as a
  separate SKU in most markets — CATL sells through OEM integrator
  channels. Eaton xStorage uses EnerOne as the rack OEM, demonstrating
  the integrator path exists. ARCNODE customers pursuing the DC-coupled
  profile with EnerOne should expect to procure through an authorized
  integrator with associated lead time and minimum order quantities.

  Cell options: standard cell is 280 Ah LFP at 1C; long-life option is
  available at up to 12,000 cycles (vs. standard 10,000). Cell selection
  is a deployment-specific decision affecting both cost and useful life.

  Grid-forming: EnerOne does not grid-form. In the DC-coupled profile, the
  paired PCS (PD500) provides grid-forming via its V&f islanded mode. The
  BESS exposes only charge/discharge/standby states to the PCS.

  Sovereign / DOD eligibility: not eligible for DOD procurement post-2027
  per DOD 1260H restrictions on CATL. For sovereign or DOD-eligible
  deployments, the DC-coupled profile requires substituting a non-CATL
  BESS — KORE Power's Mark 2 or similar US-fab DC-output products are
  the alternates, with weaker hyperscaler pedigree. Document substitute
  options in customer materials.
