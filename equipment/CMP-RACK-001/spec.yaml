notes: |
  Schneider NetShelter SX Advanced (AR9658 family) is the v1 reference
  rack for the ARCNODE Compute Container per ADR-002. 52U × 750mm wide ×
  1200mm deep, 19" EIA mounting rails, ANSI/EIA-310-E compliant.

  Form factor compatibility:
  - Compatible with: 19" 4U HGX servers (Supermicro CMP-NODE-001, Dell
    XE9680 6U, HPE XD685 5U, Lenovo SR780a V3 5U)
  - NOT compatible with: NVIDIA MGX 600mm OCP ORV3 1U sleds (different
    rack standard; need 600mm-wide MGX rack reference design instead)
  Per ADR-002, MGX is deferred to v2 — NetShelter SX is correctly chosen
  for HGX-only v1.

  Capacity per ARCNODE container:
  - Up to 7 HGX 4U nodes (CMP-NODE-001) at ~10.5 kW each = ~74 kW + ~7 kW overhead = ~80 kW
  - Plus 1-2 ToR switches at ~2 kW each
  - Plus rPDU for power distribution
  - Compute Container total: ~80 kW well within rack thermal envelope and
    power budget

  Power distribution: NetShelter SX accommodates two rPDUs per rack
  (front + rear or both at rear). For ARCNODE: NetShelter Rack PDU
  Advanced 60A or 63A, 1+1 redundant, monitored. Captured as a separate
  equipment_spec (CMP-PDU-001) — TBD authoring.

  Ganging: side panels removable for adjacent rack ganging if multi-rack
  Compute Container configurations are needed. v1 default is single-rack
  per Compute Container.

  Cable management: vertical cable managers integrate at rack sides;
  brush strip cable entry at top supports the dense 8× 400G NIC routing
  of HGX nodes. Roof-mounted busway (separate equipment_spec) supports
  high-current power distribution.

  Liquid cooling integration: NetShelter SX is rack-vendor-neutral on
  liquid cooling. CDU manifold (rear-of-rack, vertical or horizontal)
  is sourced separately and mounted to rack rails. ARCNODE pairs with
  Motivair or vendor-supplied manifold equipment.

  Schneider AI Reference Design Library (Designs 95, 99, 102) explicitly
  diagram NetShelter SX with liquid-cooled HGX deployments — useful as
  reference architecture validation for the ARCNODE Compute Container.

  ITAR-domestic: Schneider/APC has US fabrication for NetShelter SX
  family. dod_eligible default.

  Alternates (kept as v2 candidates):
  - Vertiv VRC-S / Smart Cabinet (similar 19" 750mm class)
  - nVent Hoffman / Eldon (rack-vendor-neutral chassis option)
