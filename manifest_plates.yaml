# Curated plate registry consumed by build_manifest.py.
# Each entry maps plate_id → version + sibling-repo location for v1.
# Step 6 will replace this with manifest discovery from edp-interface-plates'
# CI-published artifacts; for now it's curated here so build_manifest can
# generate plate URLs without cross-repo coupling.

plates:
  CG:
    version: v1
    spec_relpath: cad/specs/CG/spec.yaml
    step_relpath: cad/specs/CG/plate.step
    dxf_relpath: cad/specs/CG/plate.dxf
    drawing_meta_relpath: cad/specs/CG/drawing_meta.json
  BG-AC:
    version: v1
    spec_relpath: cad/specs/BG-AC/spec.yaml
    step_relpath: cad/specs/BG-AC/plate.step
    dxf_relpath: cad/specs/BG-AC/plate.dxf
    drawing_meta_relpath: cad/specs/BG-AC/drawing_meta.json
  BG-DC:
    version: v1
    spec_relpath: cad/specs/BG-DC/spec.yaml
    step_relpath: cad/specs/BG-DC/plate.step
    dxf_relpath: cad/specs/BG-DC/plate.dxf
    drawing_meta_relpath: cad/specs/BG-DC/drawing_meta.json
  CD:
    version: v1
    spec_relpath: cad/specs/CD/spec.yaml
    step_relpath: cad/specs/CD/plate.step
    dxf_relpath: cad/specs/CD/plate.dxf
    drawing_meta_relpath: cad/specs/CD/drawing_meta.json
