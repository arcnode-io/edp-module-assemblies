stages:
  - check
  - mirror

checks:
  stage: check
  script:
    - uv run poe checks
    - uv run poe build-envelopes
    # TODO: build-compute + build-manifest need plate STEP from sibling
    # edp-interface-plates repo; add cross-repo artifact pull when CI
    # plumbing for that lands. For now skip plate-dependent tests in CI.
    - uv run pytest --junitxml=junit.xml --deselect src/assemblies/test_compute_container.py --cov src/
    - uv run coverage xml
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    when: always
    reports:
      junit: junit.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

mirror:
  stage: mirror
  variables:
    GIT_STRATEGY: clone
    GIT_DEPTH: 0
  script:
    - git checkout -B main
    - git push --mirror git@github.com:arcnode-io/edp-module-assemblies.git
  only:
    - main
