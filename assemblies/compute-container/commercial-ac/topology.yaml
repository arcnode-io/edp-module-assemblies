  # Coolant Distribution Unit — Redfish per Motivair
  - device_type: cdu
    description: Motivair MCDU-10 210kW (CMP-CDU-001)
    host: mock-redfish-server
    port: 8443
    protocol_config:
      protocol: redfish
      username: arcnode
      password_secret_ref: secrets/redfish/cmp_cdu_password
      service_root: /redfish/v1
      resource_maps:
        - { name: thermal, uri: /Chassis/CDU/Thermal }
        - { name: pumps, uri: /Chassis/CDU/Pumps }

  # ToR Switch — Redfish (Cumulus Linux)
  - device_type: network_switch
    description: NVIDIA Spectrum-X SN5600 800GbE (CMP-SWITCH-001)
    host: mock-redfish-server
    port: 8443
    protocol_config:
      protocol: redfish
      username: arcnode
      password_secret_ref: secrets/redfish/cmp_switch_password
      service_root: /redfish/v1
      resource_maps:
        - { name: thermal, uri: /Chassis/SW1/Thermal }
        - { name: ports, uri: /Fabric/SW1/Ports }

  # 4x PDUs — SNMP (PRO3X Xerus)
  - device_type: pdu
    description: Server Tech PRO3X 60A 3ph #1 A-feed (CMP-PDU-001)
    host: mock-snmp-server
    port: 161
    protocol_config:
      protocol: snmp
      creds:
        user: arcnode_snmp
        auth_proto: SHA256
        priv_proto: AES256
      oid_maps:
        - { name: input_current, oid: 1.3.6.1.4.1.1718.4.1.3.3.1.7 }
        - { name: input_voltage, oid: 1.3.6.1.4.1.1718.4.1.3.3.1.6 }
        - { name: outlet_state, oid: 1.3.6.1.4.1.1718.4.1.8.5.1.2 }

