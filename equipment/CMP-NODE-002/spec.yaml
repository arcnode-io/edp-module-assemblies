  confidence_flags:
    - field: model_number
      flag: conflicts_with_product_page
      note: Current spec table lists HGX H200 8-GPU (141GB) only; the 2024 datasheet listed H100 80GB and H200. Supermicro does not confirm new H100 builds; H100 units are reseller stock (checked 2026-10-14). Confirm at quote.
    - field: spec.electrical.power_kw
      flag: assumed_default
      note: 7.94 kW from edp-api's H100 sizing (B200 first-principles with 700 W GPU TDP). Not a vendor figure.
    - field: spec.ports.PWR.connector_spec
      flag: missing
      note: Two AC inputs per PWS-5K26G-2R (80 PLUS report "16-14.4 x2"; user manual App. B, 3000 W at 207.1-240 Vac, 16-14.5 A per input). C20 inlet type from third-party listings only.
    - field: spec.thermal.flow_rate_lpm
      flag: missing
      note: Cold-plate flow per node not published; comes with Supermicro's rack integration.

notes: |
  H100 counterpart of CMP-NODE-001 (B200): same Supermicro X13 platform
  (X13DEG-M), 4U, direct-to-chip liquid cooling, sold only as part of a
  liquid-cooled rack. Selected by edp-api when the order's gpu_variant is
  h100_sxm. Datasheet: 4x 5250 W (2+2) Titanium PSUs, 200-240 Vac; net
  80 kg; operating 10-35 °C.
