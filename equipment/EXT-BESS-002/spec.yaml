        keys: SoC 0x0022, SoH 0x0023, system V 0x0020 (0.1V/bit), system A
        0x0021 (1A/bit offset -20000), max chg/dch power 0x0310/0x030F.
        Control: EMS_cmd 0x0381, Fault_Clear 0x038C. Cell-level voltages
