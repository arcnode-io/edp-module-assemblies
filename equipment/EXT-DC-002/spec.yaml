notes: |
  Evapco eco-Air EAW-DD is the v1 alternate dry cooler seed for ARCNODE,
  ranked #2 in the dry cooler Chrome session. Primary differentiator over
  Güntner GFD (EXT-DC-001): US-fab (Taneytown MD headquarters and
  manufacturing) making it the DOD-eligible dry cooler option. fab_tier
  set to dod_eligible.

  The Güntner/Evapco selection logic for ARCNODE deployments:
  - Default: EXT-DC-001 (Güntner GFD) — better per-fan control granularity
  - DOD-eligible deployments: EXT-DC-002 (Evapco eco-Air) — US-fab required

  CTI-201 certification is Evapco's most important technical differentiator.
  As of 2026, Evapco is the only manufacturer with a CTI-certified dry
  cooler product line (per CTI STD-201 Dry RS). This is third-party thermal
  performance verification — the selection software outputs match what the
  unit actually delivers. For ARCNODE deployments where thermal performance
  guarantee matters (defense, critical infrastructure), CTI certification
  is a meaningful procurement requirement. Can be written into ARCNODE's
  customer-facing deployment spec as a required certification.

  Double-stack V-coil (EAW-DD): maximizes heat rejection per footprint by
  stacking two V-coil sections vertically. Relevant for ARCNODE deployments
  with constrained pad area — same footprint, double the heat rejection vs
  single-stack. Fan motors on both stack levels. Factory-pre-wired to UL
  standards with fused disconnects.

  eco-Air APEX (2026): EVAPCO's newest evolution (announced February 2026)
  targets large-scale mission-critical heat rejection. Stainless steel 304L
  tubing standard, heavy-gauge aluminum fins, ships in 3 segments for large
  models. CTI-201 certified. Worth re-evaluating for v1 if ARCNODE targets
  above 400 kW primary loop duty; APEX may offer better density than EAW-DD
  at that scale.

  Adiabatic pre-cooling option (EAW-DA): available as upgrade for high-
  ambient-temperature deployments (>35°C site design ambient). Adds wetted
  adiabatic pads that lower entering air temperature, effectively extending
  the dry cooler's rejection capacity in hot climates. For ARCNODE
  deployments in desert, tropical, or Gulf-region environments, specify
  EAW-DA rather than EAW-DD. Capture in deployment-specific BOM notes.

  Primary loop integration: Evapco eco-Air connects directly to the
  Compute Container (integrated thermal)'s CDU primary loop (facility-side supply and return).
  EMS supervises leaving fluid temperature setpoint; unit operates
  autonomously on internal control sequence with fallback to last setpoint.
  Aligns with the supervisory control architecture confirmed across all
  ARCNODE Chrome sessions.
