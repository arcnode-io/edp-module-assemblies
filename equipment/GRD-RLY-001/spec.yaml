notes: |
  SEL-351-7 is the v1 reference protective relay for the ARCNODE Grid
  Container. SEL is the US protective relay incumbent, paired routinely
  with ABB SafeGear (GRD-SWG-001) in industrial and utility deployments.

  Device numbers (ANSI/IEEE C37.2):
  - 50/51: Phase, ground, negative-sequence overcurrent (instantaneous + time)
  - 67: Directional overcurrent
  - 27/59: Under/overvoltage
  - 81U/81O: Under/overfrequency
  - 25: Synchronism check
  - 79: Reclosing
  - 32: Directional power
  - 21: Distance (line backup)

  Anti-islanding for grid-tied deployments handled by 81U/81O + 27/59
  setpoints per IEEE 1547. For grid-forming Megapack deployments, the
  relay coordinates with Megapack's grid-forming inverter for intentional
  islanding ride-through.

  Communications stack:
  - DNP3 LAN/WAN + serial (Level 2, 6 simultaneous sessions)
  - Modbus TCP + RTU (3 simultaneous sessions)
  - IEC 61850 MMS + GOOSE (optional, recommended for utility interconnect)
  - Mirrored Bits for relay-to-relay communication
  - IEEE C37.118 synchrophasors

  EMS integration: ARCNODE EMS supervises via DNP3 (primary) or Modbus
  TCP (secondary). Relay operates autonomously on its protection settings
  and reports state/events to EMS. EMS does not change protection
  settings at runtime — settings are commissioning-time and locked.

  Time sync: IRIG-B input from SEL-2407 satellite-synchronized clock or
  PTP via Ethernet for synchrophasor accuracy. Required for sequence-of-
  events recording with sub-millisecond accuracy.

  Cybersecurity: Role-based access, secure firmware updates, port
  hardening per SEL Cybersecurity Application Guide. NERC CIP-eligible.

  ITAR-domestic: SEL is US-fab in Pullman WA, employee-owned. No foreign
  manufacturing. fab_tier dod_eligible without per-unit verification.

  Alternates: GE Multilin F35 (industrial common), ABB REF615 (ABB-aligned
  if SafeGear deployment integrates ABB controls). SEL is the v1 default;
  alternates as v2 if customer has existing relay vendor relationships.

  Settings configuration: SEL settings groups (6 available) allow
  deployment-specific configuration without hardware changes — deployment
  EDP includes the settings file (.txt format) generated by acSELerator
  QuickSet, signed and version-controlled.
