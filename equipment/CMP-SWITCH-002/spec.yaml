notes: |
  NVIDIA Quantum-2 QM9700 is the v1 InfiniBand fabric switch for ARCNODE
  Compute Containers targeting AI training workloads. Paired with
  CMP-SWITCH-001 (Spectrum-X SN5600 for inference/Ethernet) to give
  ARCNODE operators a workload-appropriate fabric choice.

  Use case split:
  - CMP-SWITCH-001 (Spectrum-X SN5600): 800GbE Ethernet with RoCE
    acceleration. Best for inference-focused deployments, existing
    Ethernet infrastructure, or when InfiniBand is not required.
  - CMP-SWITCH-002 (QM9700): NDR 400G InfiniBand. Best for training
    workloads requiring maximum GPU-to-GPU bandwidth, GPUDirect RDMA,
    and SHARP in-network collective operations.

  For ARCNODE v1 single-rack HGX deployments (up to 7 nodes, 56 GPUs),
  a single QM9700 provides 64 NDR 400G ports — sufficient for 48 GPU
  NICs at 1:1 NIC:port ratio with 16 uplink ports for spine connectivity.
  No additional spine switch required in the single-container deployment.

  SHARPv3: QM9700 supports NVIDIA Scalable Hierarchical Aggregation and
  Reduction Protocol v3, offloading collective MPI operations (AllReduce,
  Broadcast) to the switch fabric. Meaningful performance gain for
  training workloads on Transformer models with large gradient tensors.

  Fabric topology: QM9700 supports Fat Tree, SlimFly, DragonFly+,
  multi-dimensional Torus. For ARCNODE v1 single-switch deployment,
  topology is trivial (non-blocking ToR). Multi-container cluster
  deployments can use QM9700 as leaf with QM9790 (same ASIC, more
  ports) as spine. Deferred to v2.

  Backward compatibility: QM9700 NDR connects to QDR/FDR/HDR endpoints.
  Relevant for defense/sovereign customers with legacy IB-attached storage.

  Fab tier note: NVIDIA Quantum-2 ASICs are TSMC-fab; switch systems
  assembled in Israel (ex-Mellanox facility). Not US-fab; not DOD-eligible
  for procurement. Set to federal_civilian. For DOD-eligible InfiniBand
  requirements, no current clean domestic alternative — flag as risk.
