  confidence_flags:
    - field: spec.electrical.power_kw
      flag: assumed_default
      note: |
        ~10.5 kW typical sustained at full GPU load. First-principles:
        8× B200 SXM @ 1000W TDP = 8,000W + 2× Xeon @ 350W = 700W +
        32× DDR5 RDIMM @ 9W = 288W + 8× NVMe @ 12W = 96W +
        8× ConnectX-7 @ 35W = 280W + 2× BF3 DPU @ 75W = 150W +
        VRM losses ~5% = 450W + fans/BMC/misc = 150W = 10,114W internal;
        at 96% Titanium PSU efficiency = ~10.5 kW AC draw.
        Do not use PSU nameplate (26.4 kW) for power budgeting.
    - field: spec.thermal.heat_load_kw
      flag: assumed_default
      note: |
        ~10.0 kW = ~95% of 10.5 kW total power captured by DLC-2 cold
        plates. Residual ~0.5 kW air-cooled via fan exhaust.
        Per-container thermal budget at 7 nodes = 70 kW nodes + ~7 kW
        overhead (switch, CDU pump, PDU losses) = ~77 kW; round to 80 kW.
    - field: spec.electrical.voltage_v
      flag: ambiguous
      note: |
        4× 6600W Titanium PSUs accept 200-240V AC single-phase. ARCNODE
        deployment uses 415Y/240V wye from Trihal secondary, giving
        240V phase-to-neutral to each PSU via C19 outlet on PRO3X PDU.
    - field: spec.electrical.current_a
      flag: assumed_default
      note: 10.5 kW / 240V ≈ 44A typical sustained per node, drawn 4× across PSUs.
    - field: spec.mechanical.dimensions_mm
      flag: assumed_default
      note: 4U height = 178mm; 19" width = 482mm; depth ~900mm typical for HGX 4U liquid-cooled chassis. Verify with full datasheet PDF.
    - field: spec.mechanical.weight_kg
      flag: missing
      note: Loaded weight 80-120 kg typical for 8-GPU + dual Xeon + 32 DIMMs + 8 NVMe + DLC plumbing. Required for rack-loading calculations.
    - field: spec.mechanical.lift_points
      flag: missing
    - field: spec.mechanical.ip_rating
      flag: missing
    - field: spec.mechanical.ambient_temp_range_c
      flag: missing
    - field: spec.mechanical.noise_dba_at_1m
      flag: missing
      note: Liquid-cooled HGX nodes are notably quieter than air-cooled; ~50-60 dBA typical at 1m.
    - field: spec.thermal.flow_rate_lpm
      flag: missing
      note: GPU cold plate flow rate per node not stated. Critical for CDU-to-rack manifold sizing.
    - field: spec.thermal.supply_temp_c
