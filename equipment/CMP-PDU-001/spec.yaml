notes: |
  Raritan PX4 2U horizontal is the reference rack PDU for the ARCNODE
  Compute Container. The rack (CMP-RACK-001) has 4 zero-U PDU bays; 2N at
  80 kW on 34.5 kVA PDUs needs 6, so all 6 go in U space as one model.
  PRO3X was dropped (415V tops out at 17.3 kW); PRO4X C4G36RC matches
  electrically but is 0U-only.

  Sizing math for v1 HGX Compute Container (80 kW sustained):
  - 6× PX4 per Compute Container (3× A-side feed, 3× B-side feed)
  - Normal balanced operation: ~13.3 kW per PDU
  - Single-feed failure mode: surviving 3 PDUs carry full 80 kW = 26.7 kW
    each, within 34.5 kVA rating. TRUE 2N redundancy.
  - Headroom for B300/Blackwell Ultra upgrade (10% higher TDP per node):
    surviving-side load at ~88 kW = 29.3 kW per PDU, still within rating.

  HGX B200 power architecture (per CMP-NODE-001):
  - 4× PWS-6K61G-2R 6600W PSUs per node (2+2), each with two C20 inlets
    (16A each) that must both be live; phase-to-neutral 240V on 415Y/240V
  - Per-node sustained: ~10.5 kW; peak PSU capacity: 26.4 kW
  - PDU outlets per node: 8 (PSUs 1-2 → 4 cords on A, PSUs 3-4 → 4 on B);
    never split one PSU's two cords across feeds
  - 7 nodes × 8 = 56 node cords across 6 PDUs (108 Cx outlets), ~9-10 per PDU
  - Plus 2× C13 per ToR switch, 1× C13 per CDU, 1× C13 for ancillary
  - Outlet plan: at most one node cord per 16A branch breaker. A cord runs
    ~5.7A normally and ~11.5A with one feed lost, so two on one breaker
    (~23A) trip it on a feed loss. 12 breakers per PDU cover ~10 cords.
  - Inrush: <30A per PSU inlet (Supermicro), 8 inlets per node; stagger
    power-on across a PDU's breakers.

  HDOT Cx outlets accept either C14 or C20 plugs (16A, same as an IEC
  C19), so HGX node C20 plugs and switch/CDU C14 plugs share one SKU.

  EMS integration: SNMP via PDU2-MIB (Raritan MIB usage guide: applies to
  all Xerus devices, PX2/PX3/PX4 and PRO3X/PRO4X). Also Redfish, Modbus TCP
  and JSON-RPC per the PX4 spec sheet.

  Availability (2026-10-02): listed at PCNation, Tech-America, Connection
  ($3.1k-4.7k), all out of stock; quote Raritan direct.
  Per-outlet on/off control supported, useful for remote node power
  cycling without crash-cart access.

  Cybersecurity: Xerus platform supports HTTPS, SSH, SNMPv3, RADIUS,
  LDAPS, 802.1X, and signed firmware updates. NERC CIP eligible.

  Fab origin: Taiwan (GSA Advantage, GSIN 11000125269132, exact part).
  TAA compliant (Raritan TAA statement; Taiwan is a FAR 25.003 designated
  country); not BAA / Made in USA. Request a certificate of origin from
  Legrand where TAA is contractually load-bearing.

  ADR-005 (415V LV architecture): Trihal secondary set to 415Y/240V
  enables this PDU sizing.
