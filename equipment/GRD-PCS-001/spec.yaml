notes: |
  EPC Power PD500 is the seed entry for the Grid Container PCS class. Selected over
  EPC M System for v1 because PD500's liquid cooling integrates with the
  ARCNODE Compute Container CDU loop, while M is air-cooled. Both
  EPC products confirm grid-forming via explicit V&f islanded mode and
  optional black-start capability.

  STEP file not advertised on EPC public site or CDN. Mechanical drawings
  may be available via sales contact (no NDA expected per §6.1 of curation
  pipeline doc). Envelope synthesized from datasheet dimensions (Sub-pipeline
  3A). Upgrade to Sub-pipeline 3B (drawing tracing) recommended before
  Interface Plate cutout generation.

  Black-start requires external control power per datasheet — implication
  for off-grid deployments: an independent control-power source (e.g., small
  UPS or 24 VDC battery) must be specified as a companion item. Capture
  in BOM generator dependency rules.

  CTRL_PWR port accepts any of: 100-120 VAC, 208-240 VAC, or 24 VDC.
  Schema represents this as a single control_power port; deployment-specific
  selection of which mode to wire is captured at sizing-engine time.
