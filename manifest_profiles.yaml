# Curated profile→asset mapping consumed by build_manifest.py.
# Per ADR-006: this file (in this repo) is the source of truth for which
# variants/plates each deployment profile requires.
#
# Profiles in this file may reference assemblies/plates that don't exist
# yet; build_manifest.py validates and emits warnings for missing refs.
# Plate fleet (per PM 2026-05-08): CG, BG-AC, BG-DC, CD.
# All four v1 profiles ship end-to-end — every grid_container variant
# referenced below has a built assembly (step 6.1, 6.5, 6.8 all landed).

profiles:
  commercial_ac:
    # AC-coupled BESS (Tesla Megapack, CATL EnerOne with integrated PCS).
    # BESS pad outputs AC, lands on grid container's BG-AC plate.
    compute_container: commercial-ac
    grid_container: commercial-ac
    interface_plates: [CG, BG-AC, CD]

  commercial_dc_int:
    # DC strings, but PCS lives in BESS pad. BESS pad outputs AC after
    # internal PCS conversion → AC at grid container's BESS wall → BG-AC.
    # Same plate set as commercial_ac; differs only in BESS-pad packaging.
    compute_container: commercial-ac
    grid_container: commercial-ac
    interface_plates: [CG, BG-AC, CD]

  commercial_dc_ext:
    # DC strings, PCS lives INSIDE grid container. BESS pad outputs raw
    # DC bus → DC at grid container's BESS wall → BG-DC. Grid container
    # variant adds GRD-PCS-001 to the equipment layout.
    compute_container: commercial-ac
    grid_container: commercial-dc-ext
    interface_plates: [CG, BG-DC, CD]

  no_bess:
    # No BESS — site has utility power directly. Grid container still
    # present as utility tie-in / switchgear hub, no BG-* plate.
    compute_container: commercial-ac
    grid_container: no-bess
    interface_plates: [CG, CD]
