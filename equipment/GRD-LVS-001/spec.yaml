  confidence_flags:
    - field: model_number
      flag: assumed_default
      note: Reference design from QED-2 catalog 2700CT1101 (Jul 2026). Section 1 is a 36 in RK-C 1600 A individually-mounted main (65 kA); section 2 a 36 in single-row I-Line distribution section, 2000 A interior, 72 in mounting space (Table 21), holding 11x JJ 175 A (4.5 in) + 2x MJ 800 A (9 in) = 67.5 in (Table 20). The 2000 A interior is from UL 891 unknown loading (Table 21 note 27, >12 devices so interior >= 50% of the sum of ratings = 1762.5 A on dc_ext). Max MJ per section not published. A single 48 in combination main + distribution section (Table 22) may also fit; asked Schneider 2026-10-15.
    - field: spec.mechanical.dimensions_mm
      flag: assumed_default
      note: Catalog section sizes, 2 x 36 in W x 24 in D x 91.5 in H. Width and height have 0 margin, depth 152 mm spare to the reserved 762. Breaks if line and load land on the same side (60 in depth), a utility pull section is required (+42 in W), feeders need a 48 in double-row section (84 in W), or NEMA 3R (+12 in D). Confirm on submittal.
    - field: spec.mechanical.weight_kg
      flag: missing
      note: Not published in 2700CT1101; asked Schneider 2026-10-15.
    - field: spec.mechanical.mounting_notes
      flag: ambiguous
      note: Catalog offers "front or front and rear accessible" (p.5) but does not state rear-against-wall; hinged rear doors need rear access (p.15). Main top-in with feeders bottom-out is consistent with p.100; the 60 in depth trigger is lug-in/lug-out on one side of an individually-mounted R frame (Table 11 note 9), which a bus-fed main does not have. Confirm with Schneider.

notes: |
  Engineered to order against this spec; the model is the reference design (ADR-017). Main on the Trihal
  secondary (FLA 1000 kVA / (sqrt(3) x 415 V) = 1391 A) needs a 100%-rated
  1600 A breaker; compute feeders are 86 kW = 121 A continuous x 1.25 =
  151 A, so 175 A breakers (ADR-021); dc_ext adds two PCS feeders at
  602 A x 1.25 = 753 A, so 800 A breakers (ADR-022). Reference design is
  Square D QED-2; Siemens SB1 is the alternate. Eaton Pow-R-Line C is
  discontinued.
