notes: |
  Supermicro SYS-421GE-NBRT-LCC is the v1 reference GPU node for the
  ARCNODE Compute Container per ADR-002 (v1 targets HGX generation).

  SKU correction note: the Compute Chrome session named SYS-421GE-TNHR2
  -LCC as the HGX B200 SKU. That is incorrect — the TNHR2-LCC SKU is
  HGX H100/H200, not B200. The B200 4U liquid-cooled SKU is
  SYS-421GE-NBRT-LCC, used here.

  Configuration:
  - Dual Intel Xeon Scalable (4th/5th Gen, up to 385W TDP each)
  - 8× NVIDIA HGX B200 SXM GPUs, 180GB HBM3e per GPU (1.4TB total)
  - 1.8TB/s NVLink bandwidth via NVSwitch
  - 32 DIMM slots, up to 8TB DDR5-5600 RDIMM
  - 8× front hot-swap 2.5" NVMe + 2× M.2 NVMe
  - 8× 400G ConnectX-7 NICs (1:1 GPU:NIC) or BlueField-3 SuperNICs
  - 2× BlueField-3 DPUs (north-south)
  - 4× 6600W Titanium-level redundant PSUs (2+2)
  - 1× dedicated BMC/IPMI port

  Power architecture: 4× 6600W = 26.4 kW peak PSU capacity (2+2 redundant).
  Typical sustained operation ~10.5 kW AC per node. PDU and AC bus sizing
  should use 10.5 kW per node; peak PSU capacity (26.4 kW) is not the
  operating draw. ARCNODE Compute Container v1 holds 7 nodes per container
  = ~74 kW typical + overhead = ~80 kW total — well within MCDU-10's
  210 kW capacity (~2.6x headroom).

  Procurement constraint: Supermicro requires this SKU to be ordered as
  part of a complete rack-scale solution ("complete rack and onsite
  service are required" per Supermicro datasheet). ARCNODE procurement
  path: order as a 1-node SuperCluster building block with Supermicro
  onsite DLC-2 integration service. Result: integrated 4U node with
  rack-rear blind-mate manifolds pre-populated, ready to dock.

  This procurement constraint creates an architectural decision: whether
  to follow Supermicro's complete-rack-integration path (using
  Supermicro/NVIDIA reference rack) or to negotiate a deviation with
  Supermicro to ship nodes pre-integrated for ARCNODE's chosen rack
  (Schneider NetShelter SX, CMP-RACK-001). Default v1 path is Supermicro
  complete-rack integration; alternate path requires sales engagement
  and is captured as a v1 risk item.

  DLC-2: Supermicro markets this as their "Direct Liquid Cooling 2nd
  generation" platform. Cold plates on GPU, CPU, DIMM, PCIe switches,
  VRM, and PSU. Heat capture ~95% via liquid; ~5% residual air via
  fan exhaust handled by Compute Container ambient ventilation.

  Network architecture: 8× 400G ConnectX-7 NICs = east-west compute
  fabric (RDMA, GPUDirect). 2× BlueField-3 DPUs = north-south fabric
  (storage, management, in-band orchestration). For ARCNODE v1 single-
  rack deployment, east-west fabric collapses to top-of-rack switch
  (CMP-SWITCH-001 Spectrum-X for inference, or CMP-SWITCH-002 Quantum-2
  for training) and north-south fabric to a separate uplink. Multi-rack
  ARCNODE clusters use spine switches (deferred to v2).

  Management: Redfish via the dedicated BMC port. EMS supervises power
  capping and thermal setpoints; nodes operate autonomously between
  setpoint updates with last-known-value fallback. Aligns with industry
  convergence pattern observed across all ARCNODE Chrome sessions.

  Alternates (v2):
  - Dell PowerEdge XE9680 (HGX B200 6U)
  - HPE ProLiant Compute XD685 (HGX B200/B300 5U)
  - Lenovo ThinkSystem SR780a V3 Neptune (HGX 5U liquid-cooled)
  All functionally equivalent at HGX B200 8-GPU level. Add as v2
  alternates if procurement constraints force.

  ITAR-domestic: Supermicro has US fab in San Jose CA (corporate HQ
  manufacturing). Multi-region production also exists in Taiwan,
  Malaysia, and Brazil. fab_tier set to dod_eligible with per-unit
  fab origin verification at procurement.

  Open Item: B300 (Blackwell Ultra) SKU equivalent (likely
  SYS-421GE-NBRT-B300 or similar) is rolling out across Supermicro in
  2026. Specs nearly identical to B200 but with 1100W TDP per GPU
  (vs 1000W) and refreshed HBM3e. Supports drop-in upgrade as B300
  availability matures. Capture in BOM generator forward-compatibility
  rules.
