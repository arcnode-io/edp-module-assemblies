notes: |
  Server Technology PRO3X is the v1 reference rack PDU for the ARCNODE
  Compute Container. Selected over APC AP8866 (same 17.3 kW capacity)
  because PRO3X supports per-outlet metering and switching natively, and
  the Xerus Technology Platform exposes a richer API surface (SNMP,
  Modbus TCP, Redfish, JSON-RPC) for EMS integration.

  Sizing math for v1 HGX Compute Container (80 kW sustained):
  - 4× PRO3X per Compute Container (2× A-side feed, 2× B-side feed)
  - Normal balanced operation: ~20 kW per PDU (well under 43 kW rating)
  - Single-feed failure mode: surviving 2 PDUs carry full 80 kW = 40 kW
    each, within 43 kW rating. TRUE 2N redundancy.
  - Headroom for B300/Blackwell Ultra upgrade (10% higher TDP per node):
    surviving-side load at ~88 kW = 44 kW per PDU. Marginal — would
    require a 5th PDU per side or load-shedding priority list.

  HGX B200 power architecture (per CMP-NODE-001):
  - 4× 6600W Titanium PSUs per node (2+2 redundant), 200–240V AC input
  - Each PSU connects phase-to-neutral on 415Y/240V wye = 240V
  - Per-node sustained: ~10.5 kW; peak PSU capacity: 26.4 kW
  - PDU outlets per node: 4× C19 (one per PSU), distributed 2 A-side
    + 2 B-side per node for PSU-level redundancy
  - 7 nodes × 4 C19 = 28 C19 outlets needed across all PDUs
  - Plus 2× C13 per ToR switch, 1× C13 per CDU, 1× C13 for ancillary

  HDOT Cx outlets accept either C14 or C20 plugs — flexibility for
  HGX node C20 plugs and switch/CDU C14 plugs without separate PDU SKUs.

  EMS integration: Modbus TCP register map and Redfish API both supported
  via Xerus platform. SNMP MIB available for legacy infrastructure.
  Per-outlet on/off control supported, useful for remote node power
  cycling without crash-cart access.

  Cybersecurity: Xerus platform supports HTTPS, SSH, SNMPv3, RADIUS,
  LDAPS, 802.1X, and signed firmware updates. NERC CIP eligible.

  ITAR-domestic: Server Technology (Legrand) has US fab in Reno NV.
  Per-unit fab origin verification at procurement for DOD-eligible.

  ADR-005 (415V LV architecture): Trihal secondary set to 415Y/240V
  enables this PDU sizing. 480V LV would require step-down or accept
  non-2N redundancy with 6× lower-density PDUs.
