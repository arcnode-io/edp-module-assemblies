notes: |
  Motivair MCDU-10 (210 kW) is the v1 reference CDU for the ARCNODE
  Compute Container. Rack-mounted inside the Compute Container. Right-sized to v1 HGX-tier Compute Container thermal load
  (~80 kW for up to 7 Supermicro SYS-421GE 4U HGX nodes per ARCNODE
  container, with ~2x headroom for redundancy and B300/B-Ultra upgrade
  paths).

  Replaces earlier MCDU-40 seed. Initial seed assumed a 1 MW Compute load when
  sizing the Thermal Module — that figure was the GB200 NVL72 single-rack
  thermal load, not the HGX B200 4U-node figure. Actual v1 HGX-tier load
  is ~80 kW per ARCNODE Compute Container (7 nodes × 10.5 kW + ~7 kW rack
  overhead). MCDU-10 at 210 kW provides ~2.6× headroom — the right size.

  Form factor: 4OU rack-mount, 19" model. Mounts directly inside the
  Compute Container rack. Total Compute Container rack utilization at v1:
  rack-mounted CDU (4OU) + GPU nodes (6× 4U = 24U) + ToR switches (2U)
  + PDU (1-2U) + cable management = ~32-34U occupied in a 42U rack,
  ~8-10U residual.

  Forward-compatibility: MCDU-10 was originally developed for GB200 NVL72
  in the 21" OCP ORV3 form factor. ARCNODE uses the 19" variant for v1
  HGX deployments; if v2 transitions to MGX, the same MCDU-10 line
  applies with the 21" variant. No Compute Container (integrated thermal) re-engineering needed
  for the MGX transition. Strategically valuable.

  Headline operating point: 210 kW heat rejection. Supply temperature
  range W1-W5 per ASHRAE TC 9.9 liquid cooling categories. v1 reference:
  W1 (~13°C supply) for conservative GPU thermal margins. Warm-water
  operation (W3+) is a deployment-specific efficiency tradeoff.

  Control architecture: Redfish REST API as primary supervisory protocol,
  validating the industry-convergence pattern observed in prior ARCNODE
  Chrome sessions. EMS supervises CDU setpoints over Redfish; CDU runs
  autonomously on local PLC if EMS comms drop. Last-known-value fallback.

  Coolant: Motivair Technology Cooling System (TCS) is the recommended
  coolant — deionized water + corrosion inhibitors. Propylene glycol
  (PGW-25, PGW-40) available for cold-climate deployments.

  Manufacturer: Motivair is a Schneider Electric subsidiary as of late
  2024. US-fab in Lancaster NY. ITAR-domestic for federal civilian and
  DOD-eligible deployments.

  Alternates: Vertiv XDU-450 (450 kW, oversized 4.5x). nVent CDU-200
  (200 kW). CoolIT CHx40 (in-rack smaller). Add as v2 alternates if
  needed.

  Open Item: confirm exact 19" model SKU number with Motivair sales —
  press release mentions "available in 19-inch or 21-inch models" but
  does not enumerate the SKU. Required for procurement spec.
