notes: |
  Güntner GFD is the v1 primary dry cooler seed for the ARCNODE Compute
  Container primary coolant loop (CMP-CDU-001 facility-side). Ranked #1 in the dry cooler Chrome session (April
  2026) on control protocol quality (per-fan Modbus, BACnet MSTP, best
  controls documentation of evaluated vendors).

  Unlike other equipment_specs in the library, dimensions, weight, heat
  rejection capacity, and fan power are deliberately null here. The GFD
  is a configured product — customer specifies heat rejection duty, fluid
  temperatures, ambient design conditions, and Güntner GPS software
  generates the specific model selection. ARCNODE's sizing engine drives
  this selection process; the equipment_spec represents the product family,
  not a single SKU.

  The sizing engine integration path:
  1. Compute Container thermal load → CMP-CDU-001 heat rejection → primary loop design
     temperatures
  2. Site ambient conditions (from deployment inputs)
  3. Target leaving fluid temperature (setpoint for CDU)
  4. Güntner GPS API or manual selection → GFD model number, dimensions,
     fan count, power
  5. BOM generator inserts specific GFD model into EDP BOM

  Per-fan Modbus is the architectural differentiator over ranked alternates.
  Individual EC fan speed control allows the EMS to implement precise load-
  following without discrete step changes. Reduces noise at partial load
  (relevant for urban deployments), reduces fan energy at partial load, and
  allows partial-fan failure operation without full unit shutdown.

  Coolant: GFD accepts all water/glycol blends per the schema's
  coolant_compatibility list. Fluid selection is deployment-driven (DI
  water for dry climates, glycol for sub-freezing ambient exposure).

  Corrosion: Standard galvanized construction. Aluminum fin / copper tube
  coil. For coastal or aggressive-atmosphere deployments, Güntner offers
  epoxy-coated coils and stainless construction upgrades — capture in
  deployment-specific BOM notes.

  Fab tier: Güntner is a German manufacturer with US entity (Güntner U.S.
  LLC, Suwanee GA). Units for US deployments are typically manufactured in
  Czech Republic or Slovakia. Not US-fab; set to federal_civilian.
  For DOD-eligible deployments, Evapco eco-Air (EXT-DC-002) is the
  alternate with US-fab (Taneytown MD).

  Alternate: EXT-DC-002 (Evapco eco-Air EAW-DD) is the v1 US-fab dry
  cooler alternate. Ranked #2 in Chrome session. CTI-201 certified
  thermal performance guarantee is its differentiator.
