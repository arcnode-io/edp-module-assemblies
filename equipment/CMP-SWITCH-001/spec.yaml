notes: |
  NVIDIA Spectrum-X SN5600 is the v1 reference network switch for the
  ARCNODE Compute Container per ADR-002. 64-port 800GbE Ethernet, 1U
  rack-mount, RoCE-accelerated for AI workloads with congestion-aware
  scheduling.

  Why Ethernet (Spectrum-X) over InfiniBand (Quantum-2) for v1:
  - Ethernet has wider operator familiarity; lower training overhead
    for ARCNODE customer ops teams
  - Spectrum-X RoCE delivers near-InfiniBand performance for AI workloads
  - InfiniBand is the right choice for the largest training clusters
    (32k+ GPUs); ARCNODE deployments are smaller (single-container
    Compute Containers) where Spectrum-X is sufficient
  - Spectrum-X is the same NVIDIA reference architecture; same vendor
    ecosystem; same management tools

  ARCNODE Compute Container deployment:
  - 1× SN5600 per Compute Container as ToR switch
  - 6-7 HGX nodes × 8× 400G NICs = 48-56 × 400G ports needed
  - SN5600 has 64× 800G; supports 2:1 breakout to 128× 400G — comfortable
    headroom plus uplink capacity to multi-container clusters
  - North-south uplink: 1-2× 800G to spine or directly to customer
    facility network

  Power and thermal: ~2 kW at rated load, air-cooled. Adds to Compute
  Module thermal budget but small relative to GPU node load (~70 kW).
  CMP-CDU-001 has comfortable headroom.

  Management protocol: NVIDIA Cumulus Linux NOS. Redfish supported for
  telemetry (port state, traffic counters, optical levels, fan/temp/PSU).
  gNMI streaming and SNMP also available. ARCNODE EMS integrates over
  Redfish per the supervisory control architecture established in prior
  sessions.

  ARCNODE positioning note: Spectrum-X SN5600 plus HGX B200 nodes (also
  NVIDIA-architected) makes the v1 Compute Container heavily NVIDIA-aligned.
  This is intentional for v1 — NVIDIA reference architecture has the
  highest validation maturity for AI workloads. Vendor concentration risk
  is real but accepted for v1.

  Alternates (qualified per ADR-002 architecture flexibility):
  - Arista 7060X6 (US/MX/MY fab, EOS NOS, strongest non-NVIDIA option,
    better fab_tier) — author as CMP-SWITCH-002 if first non-NVIDIA-
    fabric deployment forces it
  - Cisco Nexus 9364E-SG2 (multi-region fab, Silicon One, NX-OS)
  - Juniper QFX5240 (Tomahawk 5, Junos)

  fab_tier: NVIDIA-design / Taiwan-Israel-assembly equipment is set
  conservatively to federal_civilian. For DOD-eligible deployments that
  cannot accept Taiwan-assembled networking, switch to Arista 7060X6
  primary (US/MX fab options). Capture as deployment-specific decision
  in BOM generator rules.
