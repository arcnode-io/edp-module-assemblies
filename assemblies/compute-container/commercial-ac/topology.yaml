# Per-assembly device topology consumed by edp-api dtm_generator (step 6.6).
# SIM-mode hosts use mock-{protocol}-server convention; ems-device-api flips
# to LIVE addresses on commissioning.
#
# Per BOM: 7x HGX nodes + 1x CDU + 1x switch + 4x PDUs. Rack is passive
# (no protocol per spec) — not in topology.

devices:
  # 7x HGX B200 nodes — Redfish on BMC
  - device_type: gpu_node
    description: HGX B200 server #1 (CMP-NODE-001)
    host: mock-redfish-server
    port: 8443
    protocol_config:
      protocol: redfish
      username: arcnode
      password_secret_ref: secrets/redfish/cmp_node_password
      service_root: /redfish/v1
      resource_maps:
        - { name: power, uri: /Chassis/1/Power }
        - { name: thermal, uri: /Chassis/1/Thermal }
        - { name: gpus, uri: /Chassis/1/Processors }

  - device_type: gpu_node
    description: HGX B200 server #2 (CMP-NODE-001)
    host: mock-redfish-server
    port: 8443
    protocol_config:
      protocol: redfish
      username: arcnode
      password_secret_ref: secrets/redfish/cmp_node_password
      service_root: /redfish/v1
      resource_maps:
        - { name: power, uri: /Chassis/2/Power }
        - { name: thermal, uri: /Chassis/2/Thermal }
        - { name: gpus, uri: /Chassis/2/Processors }

  - device_type: gpu_node
    description: HGX B200 server #3 (CMP-NODE-001)
