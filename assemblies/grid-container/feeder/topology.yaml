# Feeder grid container: the primary's gear minus the POI meter. A site has
# one point of interconnection, so only the primary grid container meters it.
# Trihal is passive — same reason as commercial-ac/topology.yaml.

devices:
  - template: switchgear
    description: ABB SafeGear 15kV cell (GRD-SWG-001) — passive, no connection

  - template: protective_relay
    description: SEL-351-7 distribution feeder relay (GRD-RLY-001)
    connection: { host: PROVISIONED_AT_COMMISSIONING, port: PROVISIONED_AT_COMMISSIONING }

# AC bus: protective_relay watches the switchgear's line for trip logic.
buses:
  - bus_id: ac_main
    type: ac
    members:
      - { device_template: switchgear, port: line_out }
      - { device_template: protective_relay, port: line_in }
